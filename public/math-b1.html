            { q:"|A|=5,|B|=4,|A∩B|=2，则 |A∪B|=（ ）", opts:["7","9","11","3"], ans:0 },
            { q:"下列是命题的是（ ）", opts:["x+1=2","π>3","画一条直线","你好"], ans:1 },
            { q:"命题“∀x∈R, x>0”的否定是（ ）", opts:["∃x∈R, x≤0","∀x∈R, x≤0","∃x∈R, x>0","∀x∈R, x<0"], ans:0 },
            { q:"p 假、q 真，则 p∨q 为（ ）", opts:["真","假","与 p∧q 同","无法确定"], ans:0 },
            { q:"“x>5”是“x>3”的（ ）", opts:["充分不必要","必要不充分","充要","既不充分也不必要"], ans:0 }
          ] }
      ]
    },
    { id:"ch2", name:"第二章 等式与不等式", status:"soon" },
    { id:"ch3", name:"第三章 函数", status:"soon" }
  ]
};

const $ = s => document.querySelector(s);
const LS_KEY = "mathb1_progress_v1";
let state = { ch:"ch1", sec:null };
let progress = loadProgress();

function loadProgress(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {done:[], quizBest:{}}; } catch(e){ return {done:[], quizBest:{}}; } }
function saveProgress(){ localStorage.setItem(LS_KEY, JSON.stringify(progress)); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }

/* ---------- 渲染章 tabs ---------- */
function renderTabs(){
  const el = $("#tabs"); el.innerHTML = "";
  COURSE.chapters.forEach(c=>{
    const b = document.createElement("button");
    b.className = "tab" + (c.id===state.ch?" active":"") + (c.status==="soon"?" locked":"");
    b.textContent = c.name;
    if(c.status!=="soon") b.onclick = ()=>{ state.ch=c.id; state.sec=null; render(); };
    else b.title = "敬请期待";
    el.appendChild(b);
  });
}

/* ---------- 渲染侧栏 + 主区 ---------- */
function render(){
  renderTabs();
  const ch = COURSE.chapters.find(c=>c.id===state.ch);
  if(ch.status==="soon"){ $("#secList").innerHTML=""; $("#main").innerHTML = '<div class="soon">🚧 '+ch.name+' 正在制作中，敬请期待。<br>当前已上线：第一章 集合与常用逻辑用语。</div>'; updateProg(); return; }
  if(!state.sec) state.sec = ch.sections[0].id;
  // sidebar
  const sl = $("#secList"); sl.innerHTML="";
  ch.sections.forEach(s=>{
    const b=document.createElement("button");
    b.className="sec"+(s.id===state.sec?" active":"");
    const total = s.points?s.points.length:0;
    const done = s.points? s.points.filter(p=>progress.done.includes(pid(ch.id,s.id,p.t))).length:0;
    b.innerHTML = s.name + (total?('<span class="pct">'+done+'/'+total+'</span>'):'');
    b.onclick=()=>{ state.sec=s.id; render(); };
    sl.appendChild(b);
  });
  // main
  const sec = ch.sections.find(s=>s.id===state.sec);
  const m = $("#main"); m.innerHTML="";
  if(sec.isQuiz){ m.appendChild(renderQuiz(sec)); }
  else {
    sec.points.forEach(p=> m.appendChild(renderPoint(ch.id, sec.id, p)));
    // 章节考核入口
    const qsec = ch.sections.find(s=>s.isQuiz);
    if(qsec){
      const wrap=document.createElement("div"); wrap.className="card";
      const btn=document.createElement("button"); btn.className="quiz-btn"; btn.textContent="📝 开始本章考核（"+qsec.quiz.length+" 题）";
      btn.onclick=()=>{ state.sec=qsec.id; render(); window.scrollTo({top:0,behavior:"smooth"}); };
      wrap.appendChild(btn); m.appendChild(wrap);
    }
  }
  updateProg();
}

function pid(ch,sec,t){ return ch+"|"+sec+"|"+t; }

/* ---------- 知识点卡片 ---------- */
function renderPoint(ch, sec, p){
  const card=document.createElement("div"); card.className="card";
  const done = progress.done.includes(pid(ch,sec,p.t));
  card.innerHTML =
    '<div class="pt-h '+(done?"done":"")+'" data-p="'+pid(ch,sec,p.t)+'"><span class="chk">'+(done?"✔ ":"○ ")+'</span>'+p.t+' <span class="pt-tag">'+p.tag+'</span></div>'+
    '<button class="play" data-sp="#sp-'+pid(ch,sec,p.t)+'">🔊 朗读讲解</button>'+
    '<div class="explain" id="sp-'+pid(ch,sec,p.t)+'">'+esc(p.ex)+'</div>'+
    '<div class="sum"><b>归纳总结：</b>'+p.sum+'</div>';
  // 例题
  (p.eg||[]).forEach(e=>{
    const d=document.createElement("div"); d.className="eg";
    d.innerHTML='<div class="q">💡 例题：'+esc(e.q)+'</div><span class="toggle">▸ 显示解答</span><div class="a">'+esc(e.a)+'</div>';
    d.querySelector(".toggle").onclick=function(){ const a=d.querySelector(".a"); const open=a.style.display==="block"; a.style.display=open?"none":"block"; this.textContent=(open?"▸ 显示解答":"▾ 收起解答"); };
    card.appendChild(d);
  });
  // 练习
  (p.exs||[]).forEach((ex,i)=>{
    const box=document.createElement("div"); box.className="ex";
    let opts=""; ex.opts.forEach((o,oi)=>{ opts+='<div class="opt" data-o="'+oi+'">'+String.fromCharCode(65+oi)+'. '+esc(o)+'</div>'; });
    box.innerHTML='<div class="q">✍️ 练习：'+esc(ex.q)+'</div>'+opts+'<div class="fb"></div>';
    box.querySelectorAll(".opt").forEach(el=>el.onclick=function(){
      if(box.dataset.done) return;
      const oi=+this.dataset.o;
      box.querySelectorAll(".opt").forEach(x=>x.classList.remove("picked"));
      this.classList.add("picked");
      const right = oi===ex.ans;
      box.querySelectorAll(".opt").forEach(x=>{ const xi=+x.dataset.o; if(xi===ex.ans)x.classList.add("right"); else if(xi===oi)x.classList.add("wrong"); });
      const fb=box.querySelector(".fb"); fb.style.display="block";
      if(right){ fb.className="fb ok"; fb.textContent="✅ 正确！"+esc(ex.tip||""); box.dataset.done="1"; markDone(pid(ch,sec,p.t)); }
      else { fb.className="fb bad"; fb.textContent="❌ 不对，"+esc(ex.tip||"再想想～"); }
    });
    card.appendChild(box);
  });
  // 朗读按钮
  card.querySelector(".play").onclick=function(){ speak(p.ex, this); };
  return card;
}

function markDone(id){
  if(!progress.done.includes(id)){ progress.done.push(id); saveProgress(); updateProg();
    const h=document.querySelector('.pt-h[data-p="'+CSS.escape(id)+'"]');
    if(h){ h.classList.add("done"); h.querySelector(".chk").textContent="✔ "; }
    toast("✅ 已掌握："+id.split("|")[2]);
  }
}

/* ---------- 章节考核 ---------- */
function renderQuiz(sec){
  const wrap=document.createElement("div"); wrap.className="quiz-wrap"; wrap.style.display="block";
  const card=document.createElement("div"); card.className="card";
  card.innerHTML='<div class="pt-h">📝 本章考核（'+sec.quiz.length+' 题，单选，提交后显示成绩与解析）</div>';
  const items=[];
  sec.quiz.forEach((q,i)=>{
    const it=document.createElement("div"); it.className="qitem"; it.dataset.i=i;
    let opts=""; q.opts.forEach((o,oi)=>{ opts+='<div class="opt" data-o="'+oi+'">'+String.fromCharCode(65+oi)+'. '+esc(o)+'</div>'; });
    it.innerHTML='<div class="q">'+(i+1)+'. '+esc(q.q)+'</div>'+opts+'<div class="res"></div>';
    it.querySelectorAll(".opt").forEach(el=>el.onclick=function(){
      if(it.dataset.lock) return;
      it.querySelectorAll(".opt").forEach(x=>x.classList.remove("picked")); this.classList.add("picked"); it.dataset.pick=this.dataset.o;
    });
    items.push(it); card.appendChild(it);
  });
  const submit=document.createElement("button"); submit.className="quiz-btn"; submit.textContent="提交答卷";
  submit.onclick=()=>{
    let score=0;
    items.forEach((it,i)=>{
      const pick=it.dataset.pick; const ans=sec.quiz[i].ans;
      it.dataset.lock="1";
      it.querySelectorAll(".opt").forEach(x=>{ const xi=+x.dataset.o; if(xi===ans)x.classList.add("right"); else if(pick==xi)x.classList.add("wrong"); });
      const right = pick!==undefined && +pick===ans;
      const res=it.querySelector(".res");
      if(right){ score++; res.className="res ok"; res.textContent="✅ 正确"; }
      else { res.className="res bad"; res.textContent="❌ 正确答案："+String.fromCharCode(65+ans); }
    });
    const sc=document.createElement("div"); sc.className="score"; sc.textContent="本章考核得分："+score+" / "+sec.quiz.length+"（"+(Math.round(score/sec.quiz.length*100))+" 分）";
    card.insertBefore(sc, submit);
    const best=progress.quizBest[state.ch]||0;
    if(score>best){ progress.quizBest[state.ch]=score; saveProgress(); updateProg(); }
    submit.disabled=true; submit.textContent="已提交（可重做请刷新）";
    window.scrollTo({top:0,behavior:"smooth"});
  };
  card.appendChild(submit); wrap.appendChild(card); return wrap;
}

/* ---------- 进度 ---------- */
function updateProg(){
  const ch=COURSE.chapters.find(c=>c.id===state.ch);
  let total=0, done=0;
  if(ch && ch.status==="ready"){
    ch.sections.forEach(s=>{ if(s.points){ total+=s.points.length; done+=s.points.filter(p=>progress.done.includes(pid(ch.id,s.id,p.t))).length; } });
  }
  $("#progTxt").textContent = done+" / "+total;
  $("#progBar").style.width = (total? Math.round(done/total*100):0)+"%";
  $("#quizBest").textContent = progress.quizBest[state.ch]!=null ? (progress.quizBest[state.ch]+" 分") : "—";
}

/* ---------- TTS 朗读（浏览器内置，规避服务端 TTS 被墙）---------- */
let voices=[];
if('speechSynthesis' in window){ try{ voices=speechSynthesis.getVoices(); }catch(e){} speechSynthesis.onvoiceschanged=()=>{ try{voices=speechSynthesis.getVoices();}catch(e){} }; }
function speak(text, btn){
  if(!('speechSynthesis' in window)){ toast("当前浏览器不支持朗读，请用 Chrome/Edge"); return; }
  speechSynthesis.cancel();
  const plain = text.replace(/<[^>]+>/g,"").replace(/[●•·]/g,"");
  const u=new SpeechSynthesisUtterance(plain);
  const v=voices.find(v=>/zh[-_]?(CN|TW|Hans)/i.test(v.lang)) || voices.find(v=>/^zh/i.test(v.lang)) || null;
  if(v) u.voice=v; u.lang="zh-CN"; u.rate=0.98; u.pitch=1;
  u.onstart=()=>{ if(btn){ btn.classList.add("playing"); btn.textContent="⏹ 停止朗读"; } };
  u.onend=()=>{ if(btn){ btn.classList.remove("playing"); btn.textContent="🔊 朗读讲解"; } };
  u.onerror=()=>{ if(btn){ btn.classList.remove("playing"); btn.textContent="🔊 朗读讲解"; } };
  speechSynthesis.speak(u);
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

render();
</script>
